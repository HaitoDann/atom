# Bac à sable pour le mode Code : Atom lance des conteneurs jetables pour exécuter les tests.
# Activation : dans .env, ajoute
#   COMPOSE_FILE=docker-compose.yml:docker-compose.sandbox.yml
# puis ./update.sh
#
# ⚠ Le socket Docker donne à Atom le contrôle de Docker sur ce serveur. Atom ne s'en sert que pour créer
# des conteneurs de test isolés (sans réseau, sans privilèges, limités, supprimés après usage), mais garde
# un mot de passe solide et n'expose pas Atom sur Internet sans Tailscale.
services:
  atom:
    environment:
      - ATOM_SANDBOX=1
      - ATOM_SANDBOX_TIMEOUT=${ATOM_SANDBOX_TIMEOUT:-300}
      - ATOM_SANDBOX_MEMORY_MB=${ATOM_SANDBOX_MEMORY_MB:-2048}
      - ATOM_SANDBOX_CPUS=${ATOM_SANDBOX_CPUS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
