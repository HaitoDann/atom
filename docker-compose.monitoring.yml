# Tableau de bord Grafana intégré à Atom (Prometheus + Grafana), affiché dans l'interface : vue « Tableau de bord ».
# Activation : dans .env, ajoute
#   COMPOSE_FILE=docker-compose.yml:docker-compose.monitoring.yml   (ajoute aussi :docker-compose.nas.yml, etc. si besoin)
#   ATOM_METRICS_TOKEN=…   (openssl rand -hex 32)
# puis ./update.sh
#
# Aucun port n'est ouvert : Grafana n'est joignable qu'à travers Atom (/grafana/), donc derrière ton mot de passe Atom.
# Les visiteurs y sont en lecture seule (accès anonyme « Viewer », que seul le relais d'Atom peut atteindre).
services:
  prometheus:
    image: prom/prometheus:v3.16.0-busybox   # version épinglée (avec /bin/sh pour injecter le jeton)
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Le jeton n'est pas écrit dans le dépôt : il est injecté dans la configuration au démarrage.
    command:
      - >-
        sed "s|__ATOM_METRICS_TOKEN__|$${ATOM_METRICS_TOKEN}|" /etc/prometheus/atom.yml > /prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$${PROM_RETENTION} --web.listen-address=:9090
    environment:
      - ATOM_METRICS_TOKEN=${ATOM_METRICS_TOKEN:?ATOM_METRICS_TOKEN manquant dans .env (openssl rand -hex 32)}
      - PROM_RETENTION=${PROM_RETENTION:-90d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/atom.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0   # version épinglée
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-${ATOM_METRICS_TOKEN}}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/atom.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_LIVE_MAX_CONNECTIONS=0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  atom:
    environment:
      - ATOM_GRAFANA_URL=http://grafana:3000
      - ATOM_METRICS_TOKEN=${ATOM_METRICS_TOKEN}

volumes:
  prometheus-data:
  grafana-data:
