# Configuration minimale de SearXNG pour Atom : JSON activé, pas de limiteur (usage privé).
use_default_settings: true

general:
  instance_name: "Atom"

server:
  secret_key: "remplace-par-SEARXNG_SECRET"   # écrasé par la variable SEARXNG_SECRET
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  default_lang: "fr"
  formats:
    - html
    - json

ui:
  default_locale: "fr"
